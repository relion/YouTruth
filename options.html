<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>YouTruth</title>
  <style>
    :root { --bg:#fff; --fg:#1f1f1f; --muted:#666; --border:#d8d8de; --accent:#d32f2f; --ok:#2e7d32; --err:#c62828; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#18181b; --fg:#ececec; --muted:#a0a0a8; --border:#3a3a40; --ok:#66bb6a; --err:#ef5350; }
    }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 "Segoe UI", Arial, sans-serif; }
    .wrap { max-width:560px; margin:40px auto; padding:0 16px; }
    h1 { display:flex; align-items:center; gap:10px; font-size:24px; }
    label { display:block; font-weight:600; margin:20px 0 6px; }
    .hint { color:var(--muted); font-size:13px; margin:4px 0 0; }
    .row { display:flex; gap:8px; }
    input[type=number] { padding:8px 10px; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--border); border-radius:6px; }
    input[type=text], input[type=password], select {
      flex:1; width:100%; padding:8px 10px; font:inherit; color:inherit;
      background:var(--bg); border:1px solid var(--border); border-radius:6px;
    }
    input[type=text], input[type=password] { direction:ltr; text-align:left; }
    button {
      padding:8px 14px; font:inherit; border-radius:6px; cursor:pointer;
      border:1px solid var(--border); background:transparent; color:inherit;
    }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .check { display:flex; align-items:center; gap:8px; font-weight:normal; }
    .actions { margin-top:28px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    #status { font-size:14px; }
    .ok { color:var(--ok); } .err { color:var(--err); }
    a { color:#1e88e5; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><img src="icons/icon48.png" width="36" height="36" alt=""><span data-i18n="optTitle"></span></h1>

    <label for="language" data-i18n="languageLabel"></label>
    <select id="language"></select>
    <p class="hint" data-i18n="languageHint"></p>

    <label for="apiKey" data-i18n="apiKeyLabel"></label>
    <div class="row">
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…">
      <button id="toggleKey" type="button" data-i18n="show"></button>
    </div>
    <p class="hint" data-i18n-html="apiKeyHint"></p>
    <p class="hint"><a href="https://aistudio.google.com/billing" target="_blank" rel="noopener" data-i18n="billing"></a></p>

    <label for="model" data-i18n="modelLabel"></label>
    <input id="model" type="text" list="models" spellcheck="false">
    <datalist id="models">
      <option value="gemini-2.5-flash">
      <option value="gemini-2.5-flash-lite">
      <option value="gemini-2.5-pro">
    </datalist>
    <p class="hint" data-i18n="modelHint"></p>

    <label class="check"><input id="autoAnalyze" type="checkbox"> <span data-i18n="autoLabel"></span></label>
    <p class="hint" data-i18n="autoHint"></p>

    <label for="shortsDelay" data-i18n="shortsDelayLabel"></label>
    <p class="hint" style="margin:0 0 6px" data-i18n="shortsDelayHint"></p>
    <input id="shortsDelay" type="number" min="0" max="60" step="1" style="width:90px">

    <label class="check"><input id="showDetails" type="checkbox"> <span data-i18n="detailsLabel"></span></label>
    <p class="hint" data-i18n="detailsHint"></p>

    <div class="actions">
      <button id="save" class="primary" data-i18n="save"></button>
      <button id="test" type="button" data-i18n="test"></button>
      <button id="clearCache" type="button" data-i18n="clearCache"></button>
      <span id="status"></span>
    </div>
  </div>
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
